[package]
name = "ply-memory"
version = "0.1.0"
description = "Read-only parsing and retrieval core for Ply Knowledge"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# A mirror link read back without the `\\?\` verbatim prefix.
dunce = "1"

[dev-dependencies]
tempfile = "3"
