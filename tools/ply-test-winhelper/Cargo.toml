[package]
name = "ply-test-winhelper"
version = "0.1.0"
description = "App tester on Windows: trusted input, window screenshots, fixed read-only queries and the bridge relay for Plyloft Test in the VM (dev tooling, never bundled)"
edition = "2021"
publish = false

# Standalone on purpose, like ply-test-mcp: not a member of src-tauri's
# workspace, never bundled, never part of Plyloft's dependency graph.
[workspace]

[dependencies]
serde_json = "1"
base64 = "0.22"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
